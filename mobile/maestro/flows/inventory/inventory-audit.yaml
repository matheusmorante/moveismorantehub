appId: com.morante.mobile
---
- launchApp:
    stopApp: false
- assertVisible:
    id: app-root
- tapOn:
    id: bottom-tab-more
- tapOn:
    id: more-sheet-tab-estoque
- extendedWaitUntil:
    visible:
      id: stock-module-inventory
    timeout: 10000
- tapOn:
    id: stock-module-inventory
- assertVisible:
    id: new-inventory-btn
- tapOn:
    id: new-inventory-btn
- assertVisible:
    id: inventory-responsible-search
- tapOn:
    id: inventory-responsible-search
- inputText: "an"
- extendedWaitUntil:
    visible:
      id: "inventory-responsible-option-.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "inventory-responsible-option-.*"
    index: 1
- extendedWaitUntil:
    visible: "Selecionado: .*"
    timeout: 10000
# A seleção já fecha o teclado; hideKeyboard pode enviar BACK e sair do fluxo.
- assertVisible:
    id: scope-full-stock-btn
- tapOn:
    id: scope-full-stock-btn
- extendedWaitUntil:
    visible:
      id: stage-card
    timeout: 15000
- tapOn:
    id: stage-card
    index: 0
- extendedWaitUntil:
    visible:
      id: increment-btn
    timeout: 15000
- tapOn:
    id: increment-btn
- tapOn:
    id: increment-btn
- tapOn:
    id: decrement-btn
- tapOn:
    id: footer-review-btn
- assertVisible:
    id: confirm-review-btn
- tapOn:
    id: review-back-btn
- tapOn:
    id: footer-back-btn
- assertVisible: "Sair da contagem"
- tapOn: "FECHAR INVENTÁRIO"
- extendedWaitUntil:
    visible:
      id: new-inventory-btn
    timeout: 15000
- assertVisible: "#LOCAL-.*"
- assertVisible:
    id: inventory-options-btn
- tapOn:
    id: inventory-card
    index: 0
- extendedWaitUntil:
    visible:
      id: stage-card
    timeout: 15000
- tapOn:
    id: stage-card
    index: 0
- extendedWaitUntil:
    visible:
      id: decrement-btn
    timeout: 15000
- tapOn:
    id: decrement-btn
- tapOn:
    id: footer-back-btn
- tapOn:
    id: footer-back-btn
- assertVisible: "Sair da contagem"
- tapOn: "FECHAR INVENTÁRIO"
- extendedWaitUntil:
    visible:
      id: new-inventory-btn
    timeout: 15000
- assertVisible: "#LOCAL-.*"
- assertVisible:
    id: inventory-options-btn
- tapOn:
    id: inventory-options-btn
    index: 0
- assertVisible: "Opções do Inventário #LOCAL-.*"
- assertVisible: "Excluir contagem"
- tapOn: "Excluir contagem"
- assertVisible: "EXCLUIR"
- tapOn: "EXCLUIR"
- assertVisible: "Contagem em andamento excluída."
- tapOn: "OK"

appId: com.morante.mobile
---
# Testa o botão do Fluxo de Entrega no detalhe, sem confirmar transições.
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Fluxo de Entrega"
    commands:
      - tapOn: "Voltar"
- extendedWaitUntil:
    visible: "Operações"
    timeout: 20000
- tapOn: "Operações"
- extendedWaitUntil:
    visible: "Resumo"
    timeout: 20000
- tapOn: "Entregas"
- tapOn: "Dias Seguintes"
- extendedWaitUntil:
    visible: "Iniciar fluxo de entrega - preparação"
    timeout: 30000
- tapOn:
    text: "ENTREGA"
    index: 0
- extendedWaitUntil:
    visible: "Detalhes do Pedido"
    timeout: 20000
- runFlow:
    when:
      visible: "Iniciar fluxo de entrega"
    commands:
      - tapOn: "Iniciar fluxo de entrega"
      - extendedWaitUntil:
          visible: "ETAPA 1 DE 4"
          timeout: 20000
      - assertVisible: "Preparação"
      - assertVisible: "Em Rota"
      - assertVisible: "Chegada"
      - assertVisible: "Atendimento"
      - assertVisible: "« Deslize para INICIAR ROTA"
      - tapOn: "Voltar"
- tapOn: "Fechar detalhes do pedido"
